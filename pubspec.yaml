name: construction_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+4

environment:
  sdk: ^3.5.4


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  slide_to_act: ^2.0.1
  pie_chart:
  google_maps_flutter: ^2.6.0
  geolocator: ^10.1.0
  geocoding:
  firebase_core:
  pinput:
  cloud_firestore: 
  image_picker:
  firebase_auth: ^5.6.0
  permission_handler: ^12.0.0+1
  flutter_swipe_button: ^2.1.3
  get:
  google_fonts:
  flutter_screenutil:
  flutter_secure_storage: ^9.2.4
  flutter_image_compress: 
  flutter_svg:
  intl: 


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^4.0.0


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  remove_alpha_ios: true
  image_path: "assets/ms_electricals_logo.jpg"
  adaptive_icon_foreground: "assets/ms_electricals_logo.jpg"
  adaptive_icon_background: "#ffffff"


flutter:
  uses-material-design: true
  assets:
    - assets/Animation - 1749205098384.gif
    - assets/profile_icon.svg
    - assets/ms_electricals_logo.jpg
    - shorebird.yaml